<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

<div class="header">
        <h1>Our Team</h1>
        <p>Meet the people behind the project.</p>
    </div>

    <div class="team-container">
        
        <div class="team-member">
            <div class="circle-pic">
                <img src="juswa.png">
            </div>
            <span class="name">Joshua Delos Reyes</span>
        </div>

        
        <div class="team-member">
            <div class="circle-pic">
                <img src="kalbo.jpg">
                
            </div>
            <span class="name">Mark Jefferson Baccay</span>
        </div>

        
        <div class="team-member">
            <div class="circle-pic">
                <img src="goding.png">
            </div>
            <span class="name">Lhouis Dior Go</span>
        </div>


    </div>

        <main class="card">

            <button id="logout">Logout</button>

        </main>
  
    <script>
        const API_URL = "https://loginsystem-6z1a.onrender.com";

        // Get the JWT token
        const token = localStorage.getItem("token");

        // If there is no token, go back to login
        if (!token) {
            window.location.href = "index.html";
        }

        // Request protected profile data
        fetch(`${API_URL}/api/profile`, {
            headers: {
                Authorization: `Bearer ${token}`
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error();
                }

                return response.json();
            })
            .then(data => {
                document.getElementById("welcome").textContent =
                    `Welcome, ${data.user.name} (${data.user.email})`;
            })
            .catch(() => {
                localStorage.removeItem("token");
                window.location.href = "index.html";
            });

        // Logout
        document.getElementById("logout").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        });
    </script>

</body>

</html>
