<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

      <video autoplay loop muted playsinline class="back-video">
        <source src="resources/your-video.mp4" type="video/mp4">
    </video>

<div class="header">
        <h1>Our Team</h1>
        <p>Meet the people behind the project.</p>
        <p id="welcome"></p>
    </div>

    <div class="team-container">
        
        <a class="team-member" href="joshua.html">
            <div class="circle-pic">
                <img src="resources/juswa.jpg" alt="Joshua Delos Reyes">
            </div>
            <span class="name">Joshua Delos Reyes</span>
        </a>

        
        <a class="team-member" href="mark.html">
            <div class="circle-pic">
                <img src="resources/kalbo.jpg" alt="Mark Jefferson Baccay">
                
            </div>
            <span class="name">Mark Jefferson Baccay</span>
        </a>

        
        <a class="team-member" href="lhouis.html">
            <div class="circle-pic">
                <img src="resources/goding.jpg" alt="Lhouis Dior Go">
            </div>
            <span class="name">Lhouis Dior Go</span>
        </a>


    </div>

        <main class="card">

            <button id="logout">Logout</button>

        </main>
  
    <script>
        const API_URL = "https://loginsystem-6z1a.onrender.com";

        // Get the JWT token
        const token = localStorage.getItem("token");

        // If there is no token, go back to login
        if (!token) {
            window.location.href = "index.html";
        } 

        // Request protected profile data
        fetch(`${API_URL}/api/profile`, {
            headers: {
                Authorization: `Bearer ${token}`
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error();
                }

                return response.json();
            })
            .then(data => {
                document.getElementById("welcome").textContent =
                    `Welcome, ${data.user.name}`;
            })
            .catch(() => {
                localStorage.removeItem("token");
                window.location.href = "index.html";
            });

        // Logout
        document.getElementById("logout").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        });
    </script>
    <script src="portfolio-transition.js"></script>

</body>

</html>
